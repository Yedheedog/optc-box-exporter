<section class="export-panel" id="demo">
  <h2>Export your character box</h2>
  <p>Select all screenshots of your in-game character box. The exporter processes each image and combines the detected cards into one self-contained HTML file.</p>
  <label for="screenshot-files">Character box screenshots</label>
  <input type="file" id="screenshot-files" accept="image/*" multiple>
  <div id="screenshot-preview" class="preview-list" aria-live="polite"></div>
  <label for="image-size-slider">Recognition image size: <output id="image-size-value">64 × 64</output></label>
  <input type="range" min="32" max="128" step="32" value="64" id="image-size-slider">
  <button type="button" id="export-btn" disabled>Recognize and download HTML</button>
  <p id="export-status" role="status" aria-live="polite"></p>
</section>
